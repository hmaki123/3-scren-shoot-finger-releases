name: Publish Latest APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'ThreeFingerShot-release.apk'
      - 'ThreeFingerShot-debug.apk'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish APK to Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Publish APK & version.json to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ThreeFingerShot-release.apk ]; then
            APK_FILE="ThreeFingerShot-release.apk"
            BUILD_KIND="Release"
          elif [ -f ThreeFingerShot-debug.apk ]; then
            APK_FILE="ThreeFingerShot-debug.apk"
            BUILD_KIND="Debug"
          else
            echo "No APK present; skipping."
            exit 0
          fi
          if [ ! -f version.json ]; then
            echo "No version.json present; skipping."
            exit 0
          fi
          SHA="$(jq -r '.sha // "latest"' version.json)"
          BUILT_AT="$(jq -r '.built_at // ""' version.json)"
          SHA256="$(jq -r '.sha256 // ""' version.json)"
          TAG="latest"
          NOTES=$(cat <<EOF
          Latest **ThreeFingerShot** ${BUILD_KIND} APK (commit \`${SHA}\`).
          Built at: ${BUILT_AT}
          SHA-256: \`${SHA256}\`

          Tap **${APK_FILE}** below on your Android phone to download and install.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" version.json --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_FILE" version.json \
              --target "$GITHUB_SHA" \
              --title "Latest APK Build" \
              --notes "$NOTES"
          fi
